# =============================================================================
# Diving Planet Bot - VPS Deployment (Pre + Pro + Caddy + Chatwoot)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker compose -f docker-compose.vps.yml logs -f dp-pro-bot
#   docker compose -f docker-compose.vps.yml down
#
# Prerequisites:
#   1. DNS records pointing to this VPS:
#      - pre.divingplanet.org
#      - api.divingplanet.org
#      - chatwoot.divingplanet.org
#   2. .env.pre and .env.pro files with real API keys
#   3. Chatwoot has its own dedicated dp-chatwoot-postgres/dp-chatwoot-redis —
#      independent of dp-pre-* and dp-pro-*, so starting Chatwoot never touches
#      the pre or pro bot data stores.
# =============================================================================

# Tope de tamaño de los registros de cada contenedor (29-sep-2026): el de Chatwoot llegó a 26 GB sin límite y
# llenó el disco del VPS (100 %), y el deploy falló por falta de espacio. 50 MB × 3 ficheros por servicio.
# Se aplica al recrear cada contenedor (el bot se recrea en cada deploy; el resto, con `docker compose up -d <servicio>`).
x-logging: &registro-limitado
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # --- Shared Caddy Reverse Proxy (automatic HTTPS) ---
  caddy:
    logging: *registro-limitado
    image: caddy:2-alpine
    container_name: dp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dp-net

  # ==================== PRE (Staging) ====================
  dp-pre-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-pre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRE_POSTGRES_PASSWORD:-pre_changeme}
      POSTGRES_DB: diving_planet
    volumes:
      - pgdata_pre:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pre-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-pre-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${PRE_REDIS_PASSWORD:-pre_changeme}
    volumes:
      - redis_data_pre:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PRE_REDIS_PASSWORD:-pre_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pre-bot:
    logging: *registro-limitado
    build: .
    container_name: dp-pre-bot
    restart: unless-stopped
    env_file:
      - .env.pre
    environment:
      # Override DB/Redis URLs to use Docker hostnames
      DATABASE_URL: postgresql://postgres:${PRE_POSTGRES_PASSWORD:-pre_changeme}@dp-pre-postgres:5432/diving_planet
      REDIS_URL: redis://:${PRE_REDIS_PASSWORD:-pre_changeme}@dp-pre-redis:6379/0
      APP_ENV: staging
      # Calibrated retrieval threshold (see docs/rag-threshold-calibration.md).
      # Pinned here (environment > env_file) so the stale RAG_MIN_SCORE=0.50
      # hand-edited into the VPS's .env.pre can never override it, and the
      # value stays versioned in the repo instead of on the server.
      RAG_MIN_SCORE: "0.40"
      # Modelos de PRE (25-sep), fijados aqui por la misma razon que el umbral: que
      # vivan en el repo y no a mano en el .env.pre del VPS (environment > env_file).
      # Son los mismos que el valor por defecto de src/config.py, y
      # tests/test_models_pinned.py falla si se separan. Mapa: README "LLM models".
      # 8-oct: PROMOCIONADO -- la respuesta del RAG con GPT-6 Luna (sin razonamiento) y respaldo a gpt-4.1-mini a los 3 s
      # (ronda respaldo-A/B; HISTORY 0.31.0). Extraccion y secundarias en gpt-4o-mini; juez en gpt-4.1.
      OPENAI_MODEL: "gpt-4o-mini"
      RAG_ANSWER_MODEL: "gpt-6-luna"
      RAG_RESPALDO_MODELO: "gpt-4.1-mini"
      RAG_RESPALDO_SEGUNDOS: "3.0"
      # Juez de grounding v3 (flag GROUNDING_V3, 28-sep): gpt-4.1 (con gpt-4.1-mini el v3 era inestable).
      GROUNDING_V3_MODEL: "gpt-4.1"
      EXTRACTION_MODEL: "gpt-4o-mini"
      OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
      OPENAI_TRANSCRIPTION_MODEL: "gpt-4o-mini-transcribe"
      JEV_MODEL: "typesafe/jev-1.13"
      # Robustness Fase 1 cutover (see docs/robustness/plan.md,
      # docs/robustness/progress-log.md). On in PRE only, to gather real
      # traffic data before deciding whether to keep it. Off everywhere else
      # by default (src/config.py). Revert by removing this line + redeploy —
      # no code rollback needed.
      LLM_EXTRACTION_CUTOVER_CERTIFICATION: "true"
      # Robustness Fase 2 cutover (dominio grupo/cantidad/edades — group_size/
      # group_allocation/ages). On in PRE only, same rationale as Fase 1: gather
      # real traffic data before deciding on production. Off everywhere else by
      # default (src/config.py). Revert = remove this line + redeploy.
      LLM_EXTRACTION_CUTOVER_GROUP: "true"
      # Robustness Fase 3 cutover (dominio ubicación — location/island/hotel).
      # On in PRE only, same rationale as Fases 1-2. Off elsewhere by default
      # (src/config.py). Revert = remove this line + redeploy.
      LLM_EXTRACTION_CUTOVER_LOCATION: "true"
      # Robustness Fase 8 cutover (dominio nacionalidad/logística —
      # is_colombian/duration/last_dive_over_2_years). On in PRE only, same
      # rationale as Fases 1-3. Off elsewhere by default (src/config.py).
      # Revert = remove this line + redeploy.
      LLM_EXTRACTION_CUTOVER_LOGISTICS: "true"
      # g-7 paso 4 (24-sep): los chats antiguos (conversations.json) y el few-shot
      # se borraron del codigo y del indice, asi que RAG_EXCLUDE_SOURCES y
      # RAG_FEWSHOT_ENABLED ya no hacen falta. l1-1 (juez de grounding unico) es
      # ahora la unica conducta del codigo: su flag tambien se retiro.
      # l1-4 (Fase L1): la captura de notas se calcula EN PARALELO en vez de
      # bloquear el turno. Ganancia ya medida: el nodo `setup` (donde viven las
      # notas) va a p50 0,748 s / p95 1,266 s sobre 90 turnos, de un turno de
      # ~4,2 s, y no hace ninguna otra llamada al LLM
      # (docs/robustness/snapshots/2026-09-23-core-l11-B1.json).
      # No es "diferir": las notas entran en el contexto del RAG, asi que se
      # lanzan al principio y se ESPERAN justo antes de quien las usa -> el bot
      # responde igual. Revert = quitar esta linea + redeploy.
      # APAGADA el 23-sep tras el A/B: la version en paralelo tiene una REGRESION
      # real de calidad (ver HISTORY 0.29.13). No encender sin arreglar antes la
      # carrera con state.history.
      # 24-sep: carrera arreglada (la foto del historial se toma en _setup_phase,
      # antes de lanzar la tarea). A/B: 2 rondas B nuevas contra las A del 23-sep,
      # 0 regresiones atribuibles (HISTORY 0.29.14) -> se QUEDA ENCENDIDA.
      # Revert = comentar esta linea.
      NOTES_IN_PARALLEL: "true"
      # U3 (u3-1, paso 1): las 9 senales del router con Jev (src/agents/jev_router.py),
      # con el router LLM de respaldo si Jev falla, tarda >2 s o DUDA (cascada por
      # confianza). A/B del 24-sep: -25 % de latencia de cliente sin cascada, y con
      # cascada 0 regresiones frente a las dos rondas A (HISTORY 0.29.15) -> se QUEDA
      # ENCENDIDO. La clave OPENROUTER_API_KEY esta en .env.pre del VPS.
      # Revert = quitar esta linea + redeploy.
      JEV_ROUTER_ENABLED: "true"
      # u3-1 paso 3 (24-sep): el acuse calido en paralelo (ver docs/robustness/u3-1-paso3-diseno.md).
      # A/B escalon 1 (misma franja): turnos de reserva p50 2,61 -> 2,07 s y media 2,90 -> 2,14 s,
      # calidad 86,4 -> 86,5 %, 0 regresiones por el acuse (HISTORY 0.29.17) -> se QUEDA ENCENDIDO.
      # Revert = quitar esta linea + redeploy.
      ACK_IN_PARALLEL: "true"
      # l2-3 (28-sep): "escribiendo…" en el chat mientras el bot prepara la respuesta. Solo
      # cambia lo que ve el cliente mientras espera, no lo que dice el bot. Revert = "false".
      CHATWOOT_TYPING_INDICATOR: "true"
      # u3-4 (24-sep): contesta y sigue (ver docs/robustness/u3-4-diseno.md). A/B escalon 1:
      # +2 dialogos core pero 3 regresiones con causa -> NO promocionado, APAGADO hasta los
      # dos arreglos del doc. Para la siguiente ronda B: poner "true" + redeploy.
      # 25-sep (Alvaro): ronda B2 del escalon 1 con v5 (arreglo 1 + arreglo 2 + puerta de
      # Jev) frente a 2026-09-24-u34-A: 4 mejoras y 3 regresiones propias, las 3 con causa
      # en los logs -> NO promocionado, APAGADO otra vez. Detalle y siguiente paso:
      # docs/robustness/u3-4-diseno.md, "Ronda B2".
      # 26-sep (Gadea): ronda B3 (pasos 1-3 + tres arreglos del escalon 0) frente a
      # 2026-09-24-u34-A: dialogos 17 -> 18/32, criterios 87,3 -> 88,6 %, 0 regresiones propias
      # (leidas con el log de PRE) -> PROMOCIONADO, se QUEDA ENCENDIDO (HISTORY 0.29.33).
      # Revert = poner "false" + redeploy.
      ANSWER_AND_CONTINUE: "true"
      # u3-5 (27-sep, Gadea): correcciones sin "¿lo cambio?" repetido ni X -> X, Jev como senal de
      # correccion, nacionalidad no deducida del idioma y minicurso recomendado (no asumido). Ver
      # HISTORY 0.29.42-0.29.46. Ronda B (27-sep) frente a la A del paso 3: empate y 8 mejoras, 0 regresiones
      # propias de estos pasos -> PROMOCIONADO, se QUEDA ENCENDIDO. (La recomendacion del minicurso va en su
      # propio flag, RECOMMEND_INFERRED_MINICOURSE, apagado.) Revert = "false" + redeploy.
      CORRECTIONS_V2: "true"
      # Paso 5 (RAG, 27-sep): catalogo como hechos en el contexto del RAG (sin atajos de precio), juez de
      # grounding v2, disponibilidad por el RAG y Jev decide si el cliente pide "recordar". Ver HISTORY
      # 0.29.47-0.29.48. Ronda B (27-sep) frente a u35-B: criterios 86,2 -> 91,2 %, dialogos 16 -> 20/32,
      # 2 regresiones propias arregladas -> PROMOCIONADO, se QUEDA ENCENDIDO. Revert = "false" + redeploy.
      RAG_V2: "true"
      # Paso 6 (27-sep): respuestas fijas y salida deterministas de S4 (WhatsApp oficial, asistente
      # virtual, queja con disculpa, link al pagar, post-venta y cambio de fecha a una persona). Ver
      # HISTORY 0.29.49-0.29.50. Ronda B (27-sep): core 91,2 -> 92,6 %, casos del paso 6 83,6 -> 91,6 %,
      # 3 regresiones propias arregladas -> PROMOCIONADO, se QUEDA ENCENDIDO. Revert = "false" + redeploy.
      S4_FIXES: "true"
      # Juez de grounding v3 (28-sep): enumera y marca cada dato del negocio; gpt-4.1 (GROUNDING_V3_MODEL).
      # Ver HISTORY 0.29.57-0.29.58. Ronda B (28-sep): 91,3 -> 93,0 %, 21 -> 23/32, 0 regresiones propias
      # -> PROMOCIONADO (vigilar p95: 5,3 -> 7,0 s por las regeneraciones). Revert = "false" + redeploy.
      GROUNDING_V3: "true"
      # u3-5 (decision de Gadea): el minicurso deducido se RECOMIENDA y lo confirma el cliente; a quien pide
      # un curso se le recomienda el Open Water. Ver HISTORY 0.29.45-0.29.58. Escalon 0 correcto, sin
      # regresiones en la ronda B (no se activa en el core) -> PROMOCIONADO. Revert = "false" + redeploy.
      RECOMMEND_INFERRED_MINICOURSE: "true"
      # Paso 9 (l2-2, 28-sep): catalogo en el prompt del sistema y a la cabeza del contexto del juez para el
      # prompt caching de OpenAI. Ver HISTORY 0.29.61. ENCENDIDO para la ronda B; si no pasa, "false".
      RAG_PROMPT_CACHE: "true"
      # 28-sep, PROMOCIONADO (HISTORY 0.29.68): si el juez rechaza la respuesta del RAG, la segunda muestra recibe
      # QUE se rechazo (antes repetia el invento y acababa en "no lo tengo"). Revert = "false" aqui y en config.py.
      RAG_REGEN_FEEDBACK: "true"
      # rag-2 (29-sep), PROMOCIONADO (HISTORY 0.29.72): base curada kb_v2 (una ficha por servicio y origen, sin
      # telefono ni precios repetidos) y busqueda sin empujones por regex. rag_piezas: top-8 71 -> 85 %,
      # contradicciones 5 -> 1; core rag2-A 92,5 % -> rag2-B 94,3 %. Revert = "false" aqui y en config.py.
      RAG_KB_V2: "true"
      # rag-3 (30-sep), PROMOCIONADO (HISTORY 0.29.84-0.29.85): la busqueda baja las fichas del otro origen del cliente
      # (origen del estado). rag_piezas: fichas cruzadas en el top-8 20 -> 0; core rag3-A 22/32 -> rag3-B 23/32.
      # Revert = "false" aqui y en config.py.
      RAG_BUSQUEDA_ORIGEN: "true"
      # 1-oct: busqueda con la pregunta original Y la reescrita, unidas por posicion. ENCENDIDO para la medida; si no
      # pasa, "false" aqui y en config.py. PROMOCIONADO 2-oct (HISTORY 0.29.94): ronda aislada busqueda-simple
      # (apagado) frente a privacidad-B: calidad y latencia iguales, +39 % de busquedas (baratas), 11 de 38 respuestas
      # con piezas extra (el pago por transferencia en "how do i pay").
      RAG_BUSQUEDA_DOBLE: "true"
      # 1-oct (J2): si el juez rechaza, Jev revisa las frases marcadas NO; si ninguna afirma nada del negocio (solo "no lo
      # tengo", asesor), la respuesta pasa. PROMOCIONADO 1-oct (ronda core 2026-10-01-juez-B, HISTORY 0.29.90): el rescate
      # leido a mano no cuela ningun invento. Revert = "false" aqui y en config.py.
      JUEZ_SEGUNDA_OPINION: "true"
      # 1-oct (Alvaro): el juez ve la presentacion oficial (PADI 5 Estrellas, 30 años). Banco
      # scripts/sonda_juez_presentacion.py: ciertos 3 -> 12/12, inventos 17 -> 18/18. PROMOCIONADO (HISTORY 0.29.91):
      # ronda core presentacion-B, rechazos del juez 3 -> 0 (lo de la cancelacion no fue por este flag: HISTORY 0.29.93).
      JUEZ_PRESENTACION: "true"
      # 2-oct (Alvaro): el juez tapa los datos personales linea a linea (antes una FAQ con "pasaporte" tapaba todos los
      # precios del catalogo >= 1.000.000 COP). Escalon 0: rechazos 10 -> 0, precio 0/5 -> 5/5. PROMOCIONADO (HISTORY
      # 0.29.92): ronda core privacidad-B, el paquete de 5 da el precio en pesos, calidad igual. Revert = "false" aqui y en config.py.
      JUEZ_PRIVACIDAD_POR_LINEA: "true"
      # Punto 3 (origen desconocido -> preguntar antes de cotizar). 7-oct: opcion C, lo hace el CODIGO; su escalon 0 en
      # PRE pasa (docs/robustness/origen-c/). Ronda core B: la puerta pasa a mirar si la RESPUESTA cotiza; ronda
      # origen-c2-B sin regresiones reales -> PROMOCIONADO, ENCENDIDO. Revert = "false" aqui y en config.py.
      RAG_ORIGEN_PREGUNTA: "true"
      # Punto 4 (s4-26, 7-oct), supuestos sueltos de la reserva. PROMOCIONADOS 7-oct (ronda core s426-B: 93,0 -> 95,6 %; HISTORY 0.30.1):
      # Jev manda sobre la regex de "menciona a alguien"; la red de "mencion perdida"
      # no saca un acompañante de "buceo"; el cierre sin cambios no se repite tras una respuesta; el RAG no da por
      # cumplida una condicion del cliente; el contexto del RAG no dice "carrito"; Jev distingue persona nueva de ya contada. Revert = quitar estas lineas y False en config.py.
      JEV_ACOMPANANTE_MANDA: "true"
      RED_MENCIONES_CON_PRINCIPAL: "true"
      CIERRE_SIN_REPETIR: "true"
      RAG_CONDICIONES_ABIERTAS: "true"
      RAG_PLAN_ELEGIDO: "true"
      JEV_PERSONA_YA_CONTADA: "true"
      # s4-27 (7-oct, Gonzalo): si el cliente nombra cuantas inmersiones y su origen consta, el contexto del RAG dice que
      # plan del catalogo es (precio-desde-islas: 124 USD 3/3, hoy 0/3). Ronda core s427-B: 95,2 -> 96,0 %, sin
      # regresiones suyas -> PROMOCIONADO. Revert = quitar esta linea y False en config.py.
      RAG_PLAN_NOMBRADO: "true"
      # s4-27 (8-oct): la ubicacion deducida de un HOTEL se declara y pasa por la puerta de Jev ("¿me pasas el contacto
      # del hotel Cocoliso?" ya no deja al cliente en las islas). PROMOCIONADO 8-oct (mini-ronda hotel: 79,7 -> 85,3 %).
      # Revert = "false" aqui y en config.py.
      HOTEL_UBICACION_DECLARADA: "true"
      # s4-28 (8-oct): la regex propone que hay ubicacion; CUAL (Cartagena / islas / ninguna) lo decide Jev
      # (customer_place). Discrepan y Jev duda: no se supone, se pregunta. PROMOCIONADO 8-oct (85,2 %). Revert = "false" aqui y en config.py.
      JEV_LUGAR_CLIENTE: "true"
      # rag-5 (30-sep): el RAG arranca a la vez que el enrutador (Jev) y se aprovecha solo con el mismo contexto
      # (si no, se rehace). PROMOCIONADO 1-oct (HISTORY 0.29.88). Revert = "false" aqui y en config.py.
      RAG_ADELANTADO: "true"
      # rag-5 (1-oct): Jev decide si el mensaje cuenta algo del cliente que haya que apuntar; si esta seguro de que
      # no, no se llama al extractor de notas. PROMOCIONADO 1-oct (HISTORY 0.29.88). Revert = "false" aqui y en config.py.
      NOTAS_PUERTA_JEV: "true"
      # Refactor multi-agente (docs/multi-agent-refactor-plan.md) — validación en
      # PRE antes del corte del legacy (Fase 5.2). STAGE B (ahora): el GRAFO sirve
      # de verdad (agent_arch on) — router → 5 nodos reales + subgrafo booking. La
      # cascada queda inactiva pero presente. Equivalencia probada en la suite
      # (1538 verde) + medición (3.00→2.80 llamadas/turno). El Stage A (deploy con
      # el código del refactor) arrancó healthy. On en PRE only; PRO intacto.
      # ROLLBACK instantáneo = quitar esta línea + redeploy (vuelve a la cascada,
      # sin cambio de código).
      AGENT_ARCH: "true"
    depends_on:
      dp-pre-postgres:
        condition: service_healthy
      dp-pre-redis:
        condition: service_healthy
    networks:
      - dp-net

  # ==================== PRO (Production) ====================
  dp-pro-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRO_POSTGRES_PASSWORD:-pro_changeme}
      POSTGRES_DB: diving_planet
    volumes:
      - pgdata_pro:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pro-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-pro-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${PRO_REDIS_PASSWORD:-pro_changeme}
    volumes:
      - redis_data_pro:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PRO_REDIS_PASSWORD:-pro_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pro-bot:
    logging: *registro-limitado
    build: .
    container_name: dp-pro-bot
    restart: unless-stopped
    env_file:
      - .env.pro
    environment:
      DATABASE_URL: postgresql://postgres:${PRO_POSTGRES_PASSWORD:-pro_changeme}@dp-pro-postgres:5432/diving_planet
      REDIS_URL: redis://:${PRO_REDIS_PASSWORD:-pro_changeme}@dp-pro-redis:6379/0
      APP_ENV: production
    depends_on:
      dp-pro-postgres:
        condition: service_healthy
      dp-pro-redis:
        condition: service_healthy
    networks:
      - dp-net

  # ==================== Chatwoot (shared inbox, own data store) ====================
  dp-chatwoot-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}
      POSTGRES_DB: chatwoot_production
    volumes:
      - pgdata_chatwoot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-chatwoot-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-chatwoot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}
    volumes:
      - redis_data_chatwoot:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-chatwoot:
    logging: *registro-limitado
    image: chatwoot/chatwoot:latest
    container_name: dp-chatwoot
    restart: unless-stopped
    depends_on:
      dp-chatwoot-postgres:
        condition: service_healthy
      dp-chatwoot-redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change_me_to_a_random_secret_key_base}
      FRONTEND_URL: https://chatwoot.is-core.dev
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "true"
      DATABASE_URL: postgresql://postgres:${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}@dp-chatwoot-postgres:5432/chatwoot_production
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/1
      REDIS_SIDEKIQ_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/2?read_timeout=10&connect_timeout=10
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      MAILER_SENDER_EMAIL: noreply@divingplanet.org
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - dp-net

  dp-chatwoot-worker:
    logging: *registro-limitado
    image: chatwoot/chatwoot:latest
    container_name: dp-chatwoot-worker
    restart: unless-stopped
    depends_on:
      dp-chatwoot-postgres:
        condition: service_healthy
      dp-chatwoot-redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change_me_to_a_random_secret_key_base}
      FRONTEND_URL: https://chatwoot.is-core.dev
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "true"
      DATABASE_URL: postgresql://postgres:${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}@dp-chatwoot-postgres:5432/chatwoot_production
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/1
      REDIS_SIDEKIQ_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/2?read_timeout=10&connect_timeout=10
      RAILS_ENV: production
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - dp-net

networks:
  dp-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata_pre:
  pgdata_pro:
  pgdata_chatwoot:
  redis_data_pre:
  redis_data_pro:
  redis_data_chatwoot:
