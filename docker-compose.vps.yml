# =============================================================================
# Diving Planet Bot - VPS Deployment (Pre + Pro + Caddy + Chatwoot)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker compose -f docker-compose.vps.yml logs -f dp-pro-bot
#   docker compose -f docker-compose.vps.yml down
#
# Prerequisites:
#   1. DNS records pointing to this VPS:
#      - pre.divingplanet.org
#      - api.divingplanet.org
#      - chatwoot.divingplanet.org
#   2. .env.pre and .env.pro files with real API keys
#   3. Chatwoot has its own dedicated dp-chatwoot-postgres/dp-chatwoot-redis —
#      independent of dp-pre-* and dp-pro-*, so starting Chatwoot never touches
#      the pre or pro bot data stores.
# =============================================================================

# Tope de tamaño de los registros de cada contenedor (29-sep-2026): el de Chatwoot llegó a 26 GB sin límite y
# llenó el disco del VPS (100 %), y el deploy falló por falta de espacio. 50 MB × 3 ficheros por servicio.
# Se aplica al recrear cada contenedor (el bot se recrea en cada deploy; el resto, con `docker compose up -d <servicio>`).
x-logging: &registro-limitado
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # --- Shared Caddy Reverse Proxy (automatic HTTPS) ---
  caddy:
    logging: *registro-limitado
    image: caddy:2-alpine
    container_name: dp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dp-net

  # ==================== PRE (Staging) ====================
  dp-pre-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-pre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRE_POSTGRES_PASSWORD:-pre_changeme}
      POSTGRES_DB: diving_planet
    volumes:
      - pgdata_pre:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pre-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-pre-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${PRE_REDIS_PASSWORD:-pre_changeme}
    volumes:
      - redis_data_pre:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PRE_REDIS_PASSWORD:-pre_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pre-bot:
    logging: *registro-limitado
    build: .
    container_name: dp-pre-bot
    restart: unless-stopped
    env_file:
      - .env.pre
    environment:
      # Override DB/Redis URLs to use Docker hostnames
      DATABASE_URL: postgresql://postgres:${PRE_POSTGRES_PASSWORD:-pre_changeme}@dp-pre-postgres:5432/diving_planet
      REDIS_URL: redis://:${PRE_REDIS_PASSWORD:-pre_changeme}@dp-pre-redis:6379/0
      APP_ENV: staging
      # Calibrated retrieval threshold (see docs/rag-threshold-calibration.md).
      # Pinned here (environment > env_file) so the stale RAG_MIN_SCORE=0.50
      # hand-edited into the VPS's .env.pre can never override it, and the
      # value stays versioned in the repo instead of on the server.
      RAG_MIN_SCORE: "0.40"
      # Modelos de PRE (25-sep), fijados aqui por la misma razon que el umbral: que
      # vivan en el repo y no a mano en el .env.pre del VPS (environment > env_file).
      # Son los mismos que el valor por defecto de src/config.py, y
      # tests/test_models_pinned.py falla si se separan. Mapa: README "LLM models".
      # 8-oct: PROMOCIONADO -- la respuesta del RAG con GPT-6 Luna (sin razonamiento) y respaldo a gpt-4.1-mini a los 3 s
      # (ronda respaldo-A/B; HISTORY 0.31.0). Extraccion y secundarias en gpt-4o-mini; juez en gpt-4.1.
      OPENAI_MODEL: "gpt-5.4-mini"
      # MOD-4 (18-oct): la reescritura de la consulta, el resumen y el detector de idioma, cada uno con su modelo.
      # PROMOCIONADO en DeepSeek (HISTORY 0.31.53). Revert = "gpt-4o-mini".
      REESCRITURA_MODEL: "deepseek/deepseek-v4.1-flash"
      RESUMEN_MODEL: "deepseek/deepseek-v4.1-flash"
      IDIOMA_MODEL: "deepseek/deepseek-v4.1-flash"
      RAG_ANSWER_MODEL: "gpt-6-luna"
      # mod-5 y CAL-F (18-oct): el respaldo del RAG en DeepSeek (otro proveedor) y RAG_NO_ADIVINA. PROMOCIONADOS (HISTORY 0.31.55:
      # ronda core mod-E 96,9 % frente a mod-C 96,5 %, ninguna regresión atribuida). Revert = "gpt-4.1-mini" y quitar
      # RAG_NO_ADIVINA.
      RAG_RESPALDO_MODELO: "deepseek/deepseek-v4.1-flash"
      RAG_NO_ADIVINA: "true"
      RAG_RESPALDO_SEGUNDOS: "3.0"
      # Juez de grounding v3 (28-sep; sin flag desde s4-25): gpt-4.1 (con gpt-4.1-mini el v3 era inestable).
      # MOD-1 (18-oct): el revisor en DeepSeek v4.1 Flash con la aclaración de s4-33 (JUEZ_V3_LUNA). PROMOCIONADO
      # (HISTORY 0.31.53: ronda core mod-C 97,8 %, ninguna regresión atribuida al modelo). Revert = "gpt-4.1" y JUEZ_V3_LUNA "false".
      GROUNDING_V3_MODEL: "deepseek/deepseek-v4.1-flash"
      # G3 (18-oct, Gadea y Álvaro): Barú no es Rosario, la búsqueda con la pregunta sola y una sola moneda.
      # PROMOCIONADO (HISTORY 0.31.53: ronda core mod-B; la regresión que parecía suya era ruido, 0/3 con los tres).
      # Revert = quitar estas tres líneas y poner los defaults en False.
      BARU_NO_ES_ROSARIO: "true"
      BUSQUEDA_CON_LA_PREGUNTA_SOLA: "true"
      RAG_SIN_PRECIO_CON_TARJETA: "true"
      EXTRACTION_MODEL: "gpt-5.4-mini"
      # mod-3 (18-oct): cada pieza de EXTRACTION_MODEL con su modelo (mismo valor hasta promocionar otro).
      SENALES_MODEL: "deepseek/deepseek-v4.1-flash"
      RED_EXTRACTOR_MODEL: "gpt-6-luna"
      # mod-G2 PROMOCIONADO (HISTORY 0.31.57: core 96,9 % igual que mod-F, ninguna regresión atribuida; la G con las dos reglas
      # del extractor empeoró a 94,3 %): el resolutor en Haiku con la regla de contradicción (banco 33/33 frente a nano 30/33,
      # que no la sigue), la tarjeta con precio aunque falte la pregunta de seguridad y recomendar a no certificados.
      # Revert = "gpt-5.4-nano" y quitar las tres de abajo.
      RESOLUTOR_MODEL: "anthropic/claude-haiku-5.5"
      TARJETA_SIN_SEGURIDAD: "true"
      RECOMENDAR_A_NO_CERTIFICADOS: "true"
      RESOLUTOR_SIN_CONTRADICCIONES: "true"
      # Ronda ex9b-4 (19-oct): el paso 6 NO se promociona (con sus campos, Anthropic rechazaba el esquema del extractor,
      # "compiled grammar is too large", y contestaba siempre el respaldo). Se queda el respaldo POR TIEMPO de
      # OpenRouter (5 s): si no contesta en 5 s, la misma petición sale por OpenAI.
      OPENROUTER_RESPALDO_SEGUNDOS: "5.0"
      # PROMOCIONADO 20-oct con la ronda ex9b-8 (98,7 % 29/32; decisión de Gadea: G9 con el paso 6): el paso 6 (duración, edades, notas) en una segunda llamada al
      # extractor (la base sin él, ex9b-7, dio 96,1 %: las rondas con él estaban dentro del ruido) y quien se suma al grupo
      # por el punto único del acompañante, decidido por Jev (banco de punta a punta 10/14 → 12/14, nadie contado dos veces).
      DURACION_POR_EXTRACTOR: "true"
      EDADES_POR_EXTRACTOR: "true"
      NOTAS_RAG_DESDE_ESTADO: "true"
      PASO6_EN_LLAMADA_APARTE: "true"
      REPARTO_AL_SUMARSE_ALGUIEN: "true"
      # PROMOCIONADO (ex9b-7/8): las cifras de los enlaces ya no se tapan al mandar el texto a
      # OpenRouter (el enlace de Maps del punto de encuentro llegaba roto con el respaldo del RAG).
      PII_RESPETA_URLS: "true"
      # gen-1 + gen-3 (20-oct, fase GEN; docs/robustness/gen/gen1-diagnostico.md): contestar lo contestable antes del
      # pase por tema médico o clima; el clima dice antes la política (decisión de Gadea); una dieta o alergia no es
      # tema médico (se lee al arrancar); y con eso la alergia alimentaria ya puede ir al RAG (ATAJO_ALERGIA_POR_RAG,
      # más arriba). APAGADOS hasta su ronda.
      CONTESTA_ANTES_DE_PASAR: "false"
      CLIMA_CON_POLITICA: "false"
      DIETA_NO_ES_MEDICA: "false"
      # CERTIFICADO_SOLO_SI_LO_DICE con «buceé hace poco» = certificado (decisión de Gadea). PROMOCIONADO (HISTORY
      # 0.31.61: mod-H2 97,0 % igual que limpieza-3; reserva-solo-link ya no ofrece el minicurso). Revert = quitar estas líneas.
      CERTIFICADO_SOLO_SI_LO_DICE: "true"
      ACUSE_MODEL: "gpt-5.4-nano"
      NOTAS_MODEL: "deepseek/deepseek-v4.1-flash"
      # ex-4 (12-oct): el extractor "LLM primero" de la fase EX (src/agents/extractor_turno.py).
      # mod-2 y mod-3 (18-oct): el extractor en Haiku 5.5 (Anthropic/Google/Amazon por OpenRouter) con RESPALDO en
      # gpt-5.4-mini a los 2 s (OpenAI), su red en Luna, las señales y las notas en DeepSeek, el resolutor y el acuse
      # en gpt-5.4-nano. PROMOCIONADO (HISTORY 0.31.56: ronda core mod-F 97,0 % frente a mod-E 96,9 %, ninguna regresión
      # atribuida a los modelos). Revert = gpt-4.1-mini aquí, gpt-4o-mini en las cinco de arriba y sin respaldo.
      EXTRACTOR_TURNO_MODEL: "anthropic/claude-haiku-5.5"
      EXTRACTOR_RESPALDO_MODELO: "gpt-5.4-mini"
      EXTRACTOR_RESPALDO_SEGUNDOS: "2.0"
      # mod-7 + Haiku (18-oct): solo proveedores de EE. UU. por OpenRouter, sin retención ni entrenamiento.
      OPENROUTER_PROVEEDORES: "baseten,fireworks/us,coreweave,google-vertex,anthropic,amazon-bedrock"
      # CAL-A2/A3 (16-oct): el plan del RAG y la comprobacion de completitud (src/agents/rag_plan.py; flags apagados).
      RAG_PLAN_MODEL: "gpt-6-luna"
      # CAL-A6 (17-oct): el revisor que añade el aviso que falta (flag AVISOS_AL_FINAL, apagado). Luna: decision de Gadea.
      AVISOS_AL_FINAL_MODEL: "gpt-6-luna"
      PREGUNTA_SOLA_MODEL: "deepseek/deepseek-v4.1-flash"
      OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
      # MOD-6 (18-oct): gpt-transcribe con el vocabulario del negocio. PROMOCIONADO (HISTORY 0.31.53). Revert = "gpt-4o-mini-transcribe"
      # y quitar TRANSCRIPCION_CON_VOCABULARIO.
      OPENAI_TRANSCRIPTION_MODEL: "gpt-transcribe"
      TRANSCRIPCION_CON_VOCABULARIO: "true"
      JEV_MODEL: "typesafe/jev-1.13"
      # G-10: si el cliente escribe en otro idioma (no espanol ni ingles), el bot contesta en ingles. PROMOCIONADO
      # 14-oct (HISTORY 0.31.22). Revert = "false" aqui y en config.py.
      IDIOMA_OTRO_EN_INGLES: "true"
      # EX-RAG-1: las politicas siempre en el contexto del RAG. PROMOCIONADO 14-oct. Revert = "false" aqui y en
      # config.py.
      RAG_POLITICAS_EN_CONTEXTO: "true"
      # EX-RAG-2: el RAG no atribuye al cliente un servicio que no dijo. PROMOCIONADO 14-oct. Revert = "false" aqui
      # y en config.py.
      RAG_NO_SUPONE_RESERVA: "true"
      # EX-FLUJO-1: una pregunta de la reserva sin contestar no se repite: vuelve antes del resumen (a la tercera vez).
      # PROMOCIONADO 14-oct (HISTORY 0.31.23). Revert = "false" aqui y en config.py.
      APLAZAR_PREGUNTA_SIN_RESPUESTA: "true"
      # EX-EXTRACTOR-1: regla de la ubicacion del extractor con la negacion primero ("sin ir de Cartagena").
      # PROMOCIONADO 14-oct (HISTORY 0.31.23). Revert = "false" aqui y en config.py.
      EXTRACTOR_ACLARACIONES: "true"
      # EX-EST-2: arreglos del prompt del extractor (v3 tras est4-B; ver config.py). PROMOCIONADO 15-oct (est5-B).
      # Revert = "false" aqui y en config.py.
      EXTRACTOR_TODO_LO_DICHO: "true"
      # EX-EST-2: arreglos del flujo de la tanda est5 (ver config.py). PROMOCIONADO 15-oct (est5-B). Revert = "false"
      # aqui y en config.py.
      EST4_FLUJO: "true"
      # EX-EST-2: Jev cuenta las peticiones en imperativo como algo que contestar (ver config.py). PROMOCIONADO
      # 15-oct (est6-B). Revert = "false" aqui y en config.py.
      JEV_PIDE_ALGO: "true"
      # EX-EST-2: el RAG no supone la fecha ni la hora de hoy. DESCARTADO 15-oct (ver config.py).
      RAG_SIN_HORA: "false"
      # EX-RAG-3: DESCARTADO 14-oct (deja pasar inventos: 12/30 errores sembrados; ver config.py).
      JUEZ_REVISA_CON_CITA: "false"
      # EX-EST-2: a un buzo certificado sin actividad elegida se le recomiendan sus opciones. PROMOCIONADO 14-oct.
      # Revert = "false" aqui y en config.py.
      RECOMENDAR_A_CERTIFICADOS: "true"
      # EX-EST-2: el acuse reconoce solo lo que dice el mensaje. PROMOCIONADO 14-oct (est3-B). Revert = "false"
      # aqui y en config.py.
      ACUSE_SOLO_EL_MENSAJE: "true"
      # EX-EST-2: arreglos de datos de la tanda est3 (ver config.py). PROMOCIONADO 14-oct (est3-B). Revert = "false" aqui y
      # en config.py.
      EST2_DATOS: "true"
      # 13-oct (Gonzalo): atencion al cliente tras el pase y en posventa, el nombre y el grupo privado. ENCENDIDOS para
      # su mini-ronda B (atencion-B): el nombre lo lee el extractor ("soy gringo" no es un nombre); el grupo privado o
      # empresa marca el pase; preguntar el precio de un producto lo elige; tras pasar a una persona y con una reserva ya
      # hecha (Jev `ya_reservado`) el bot no vuelve a vender; el aviso medico dice que pasa a una persona.
      # Si no pasan, quitar estas lineas y False en config.py.
      NOMBRE_POR_EXTRACTOR: "true"
      GRUPO_PRIVADO_PASE: "true"
      EXTRACTOR_PRECIO_ELIGE: "true"
      TRAS_PASE_SIN_VENDER: "true"
      AVISO_MEDICO_DICE_PASE: "true"
      POSVENTA_SIN_VENDER: "true"
      # ex-2 (fase EX): solo emergencias e incidencias pasan a un asesor por palabra clave; el resto lo decide Jev.
      # PROMOCIONADO 13-oct (Alvaro, HISTORY 0.31.18). Revert = "false" aqui y en config.py.
      ESCALADO_SOLO_EMERGENCIAS: "true"
      # ex-3 (fase EX): respuestas fijas que pasan al RAG. Resumen y nacionalidad PROMOCIONADOS 13-oct (HISTORY
      # 0.31.18); alergia no paso su escalon 0 (acababa en el aviso medico): APAGADO.
      ATAJO_RESUMEN_POR_RAG: "true"
      ATAJO_NACIONALIDAD_POR_RAG: "true"
      ATAJO_ALERGIA_POR_RAG: "false"
      # g-7 paso 4 (24-sep): los chats antiguos (conversations.json) y el few-shot
      # se borraron del codigo y del indice, asi que RAG_EXCLUDE_SOURCES y
      # RAG_FEWSHOT_ENABLED ya no hacen falta. l1-1 (juez de grounding unico) es
      # ahora la unica conducta del codigo: su flag tambien se retiro.
      # U3 (u3-1, paso 1): las 9 senales del router con Jev (src/agents/jev_router.py),
      # con el router LLM de respaldo si Jev falla, tarda >2 s o DUDA (cascada por
      # confianza). A/B del 24-sep: -25 % de latencia de cliente sin cascada, y con
      # cascada 0 regresiones frente a las dos rondas A (HISTORY 0.29.15) -> se QUEDA
      # ENCENDIDO. La clave OPENROUTER_API_KEY esta en .env.pre del VPS.
      # Revert = quitar esta linea + redeploy.
      JEV_ROUTER_ENABLED: "true"
      # l2-3 (28-sep): "escribiendo…" en el chat mientras el bot prepara la respuesta. Solo
      # cambia lo que ve el cliente mientras espera, no lo que dice el bot. Revert = "false".
      CHATWOOT_TYPING_INDICATOR: "true"
      # s4-33 (8-oct): las aclaraciones del juez v3 (va con GROUNDING_V3_MODEL). PROMOCIONADO con DeepSeek (HISTORY 0.31.53).
      JUEZ_V3_LUNA: "true"
      # 1-oct (Alvaro): el juez ve la presentacion oficial (PADI 5 Estrellas, 30 años). Banco
      # scripts/sonda_juez_presentacion.py: ciertos 3 -> 12/12, inventos 17 -> 18/18. PROMOCIONADO (HISTORY 0.29.91):
      # ronda core presentacion-B, rechazos del juez 3 -> 0 (lo de la cancelacion no fue por este flag: HISTORY 0.29.93).
      JUEZ_PRESENTACION: "true"
      # 2-oct (Alvaro): el juez tapa los datos personales linea a linea (antes una FAQ con "pasaporte" tapaba todos los
      # precios del catalogo >= 1.000.000 COP). Escalon 0: rechazos 10 -> 0, precio 0/5 -> 5/5. PROMOCIONADO (HISTORY
      # 0.29.92): ronda core privacidad-B, el paquete de 5 da el precio en pesos, calidad igual. Revert = "false" aqui y en config.py.
      JUEZ_PRIVACIDAD_POR_LINEA: "true"
      # Punto 3 (origen desconocido -> preguntar antes de cotizar). 7-oct: opcion C, lo hace el CODIGO; su escalon 0 en
      # PRE pasa (docs/robustness/origen-c/). Ronda core B: la puerta pasa a mirar si la RESPUESTA cotiza; ronda
      # origen-c2-B sin regresiones reales -> PROMOCIONADO, ENCENDIDO. Revert = "false" aqui y en config.py.
      RAG_ORIGEN_PREGUNTA: "true"
      # s4-31 (8-oct, Alvaro): la puerta del origen conserva la respuesta sin las frases con importe. PROMOCIONADO 8-oct
      # (mini-ronda conserva-A/B: 92,6 -> 97,0 %; HISTORY 0.31.1). Revert = "false" aqui y en config.py.
      ORIGEN_CONSERVA_RESPUESTA: "true"
      # Punto 4 (s4-26, 7-oct), supuestos sueltos de la reserva. PROMOCIONADOS 7-oct (ronda core s426-B: 93,0 -> 95,6 %; HISTORY 0.30.1):
      # Jev manda sobre la regex de "menciona a alguien"; el cierre sin cambios no se repite tras una respuesta; el RAG
      # no da por cumplida una condicion del cliente; el contexto del RAG no dice "carrito"; Jev distingue persona nueva
      # de ya contada. Revert = quitar estas lineas y False en config.py. (La red de "mencion perdida",
      # RED_MENCIONES_CON_PRINCIPAL, se quito en la limpieza ex9b: sin la pista del regex ya no corria.)
      JEV_ACOMPANANTE_MANDA: "true"
      CIERRE_SIN_REPETIR: "true"
      RAG_CONDICIONES_ABIERTAS: "true"
      RAG_PLAN_ELEGIDO: "true"
      JEV_PERSONA_YA_CONTADA: "true"
      # s4-27 (7-oct, Gonzalo): si el cliente nombra cuantas inmersiones y su origen consta, el contexto del RAG dice que
      # plan del catalogo es (precio-desde-islas: 124 USD 3/3, hoy 0/3). Ronda core s427-B: 95,2 -> 96,0 %, sin
      # regresiones suyas -> PROMOCIONADO. Revert = quitar esta linea y False en config.py.
      RAG_PLAN_NOMBRADO: "true"
      # Flujo de reserva (9-oct, Gonzalo): cada edad del mensaje cuenta como una persona para el reparto del grupo y se
      # lee "age 17" en singular (familia-mixta: ya no repregunta "¿cuantos?"). Mini-ronda s428-A/B: 83,3 -> 83,6 %,
      # ninguna regresion suya -> PROMOCIONADO. Revert = quitar esta linea y False en config.py. (ORIGEN_DEL_CLIENTE se
      # quito en ex-9: el origen ya no sale del relleno sino del extractor, con su cita.)
      GRUPO_POR_EDADES: "true"
      # s4-27 (8-oct): la ubicacion deducida de un HOTEL se declara y pasa por la puerta de Jev ("¿me pasas el contacto
      # del hotel Cocoliso?" ya no deja al cliente en las islas). PROMOCIONADO 8-oct (mini-ronda hotel: 79,7 -> 85,3 %).
      # Revert = "false" aqui y en config.py.
      HOTEL_UBICACION_DECLARADA: "true"
      # s4-28 (8-oct): la regex propone que hay ubicacion; CUAL (Cartagena / islas / ninguna) lo decide Jev
      # (customer_place). Discrepan y Jev duda: no se supone, se pregunta. PROMOCIONADO 8-oct (85,2 %). Revert = "false" aqui y en config.py.
      JEV_LUGAR_CLIENTE: "true"
      # rag-5 (1-oct): Jev decide si el mensaje cuenta algo del cliente que haya que apuntar; si esta seguro de que
      # no, no se llama al extractor de notas. PROMOCIONADO 1-oct (HISTORY 0.29.88). Revert = "false" aqui y en config.py.
      NOTAS_PUERTA_JEV: "true"
      # RONDA C (17-oct): CAL-D, la consulta de búsqueda con lo que ya sabemos del cliente. Banco: cal-42 arreglado
      # 3 de 3 (daba el paquete de 5 inmersiones cuando pedían el precio por día). Se mide SOLO este flag contra la
      # ronda A ya hecha. Revert = quitar esta línea.
      # (Los AVISOS se quedaron FUERA: dos rondas medidas, 97,4 % → 96,0 % y 96,1 %. Ver cal-a5-avisos-condicionados.md)
      CONSULTA_CON_LO_SABIDO: "true"
      # PROMOCIONADOS 17-oct (ronda D del core, 96,5 % frente al 96,1 % de la C): 3 mejoras reales, todas de no
      # repreguntar lo que el cliente ya dijo, y la mejor latencia de la noche (p95 5,0 s frente a 6,4 del suelo). Sus
      # 3 "regresiones" se demostraron ajenas repitiendo 3 veces con y sin los flags. Revert = quitar estas dos líneas.
      # `IDIOMA_DEL_EXTRACTOR` se queda FUERA: no arregla su caso (el extractor lee ese portugués como español) y no
      # mejora nada medible, así que no entra en PRE aunque tampoco rompa nada.
      JEV_CON_CONTEXTO: "true"
      PASE_SI_PIDE_FUERA_DEL_SISTEMA: "true"
      # CAL-E1 PROMOCIONADO 17-oct tras la ronda A/B del core (`2026-10-16-cal-A` vs `-cal-B`): ninguna regresión suya.
      # Los avisos (`AVISOS_CONDICIONADOS`) se REVIRTIERON en la misma ronda: 97,4 % → 96,0 % de criterios, 6
      # regresiones reales (la peor: la respuesta dejaba de dar el enlace de reserva). Revert = quitar esta línea.
      # CAL-E1 (decisión de Gadea, 16-oct): el chatbot no da números; quien pide un contacto pasa con un asesor.
      # Banco: cal-03 3/3 → 0/3. La base ya no reparte el número (28 menciones fuera de faqs.json).
      CONTACTO_PASA_A_PERSONA: "true"
      # CAL-C PROMOCIONADO 17-oct (decisión de Álvaro): los 8 flags de entender sin repreguntar. Banco CAL-C 49 → ~28/63;
      # ronda core calc-A 96,9 % 25/32 vs calc-B 96,5 % 25/32, latencia igual (p95 5,0 s); las 4 regresiones se
      # repitieron 3x con y sin los flags y solo la del idioma era suya (E4, arreglada en 104b10f). Revert = quitar
      # estas líneas y poner los defaults de src/config.py en False.
      ACTIVIDAD_POR_LO_SABIDO: "true"
      EXTRACTOR_CITA_DEL_CLIENTE: "true"
      HOTEL_POR_EXTRACTOR: "true"
      UNA_SOLA_PREGUNTA: "true"
      LUGAR_CON_DOS_LECTORES: "true"
      IDIOMA_DEL_EXTRACTOR: "true"
      SIN_CEDULA_EXTRANJERO: "true"
      TRAS_PASE_RECUERDA_EL_PASE: "true"
      # G3-03 PROMOCIONADO 18-oct (HISTORY 0.31.49): el RAG ofrece pasar con una persona en vez de decir que ya lo hizo.
      # Banco 6/6 -> 0/6; ronda core g301-B 95,6 % -> g3-B 96,5 %, ninguna regresión atribuida. Revert = quitar esta
      # línea y poner el default en False.
      RAG_OFRECE_EL_PASE: "true"
      # G3-01 PROMOCIONADO 18-oct (decisión de Álvaro): la familia con 2 certificados e hijos (minicurso y snorkel)
      # llega al precio (0/2 -> 3/3 en PRE). Ronda core g301-A 95,6 % 218/228 vs g301-B 95,6 % 218/228, p95 cliente
      # 5,4 -> 6,0 s; las 3 mejoras y 3 regresiones, repetidas 3x con y sin: ningún flag dispara en ellas (ruido).
      LO_DICHO_EN_RESPUESTA_FIJA: "true"
      REPARTO_PARCIAL_CON_LO_SABIDO: "true"
      ACTIVIDAD_PRINCIPAL_EN_EL_REPARTO: "true"
      NINOS_PRIMERO_AL_SNORKEL: "true"
      # CAL-F PROMOCIONADO 18-oct (decisión de Álvaro): refresher-rechaza-acepta 3/3 cierran con la salida y el refresher;
      # banco ex0 sin cambios atribuibles (el campo solo entra si ya lleva más de 2 años sin bucear).
      REFRESHER_POR_EXTRACTOR: "true"
      # r6-1(b) PROMOCIONADO 18-oct (decisión de Álvaro): si en un turno ninguna llamada a OpenAI funciona, el bot dice que
      # tiene un problema técnico y pasa a un asesor (en PRE con clave inválida: bien; con la buena: 0 falsos, 4/4).
      AVISO_SI_OPENAI_FALLA: "true"
      # CAL-F PROMOCIONADOS 18-oct (decisión de Álvaro): la actividad sale del reparto ("1 buzo avanzado y 2 para
      # bautismo" no es el Curso Avanzado; estado bien 3/3, y en la medida de Gadea 0/6 respuestas citan el curso) y la
      # pregunta del origen neutra con dos planes candidatos ("dura 1 día y hay que dormir en las islas" 0/3).
      ACTIVIDAD_DEL_REPARTO: "true"
      ORIGEN_NEUTRO_CON_DOS_PLANES: "true"
      # CAL-C PROMOCIONADO 17-oct: C4, C5 y C3e. Ronda core calc2-A 94,7 % 24/32 vs calc2-B 96,9 % 27/32, p95 6,4 → 6,0 s;
      # 8 mejoras y 3 regresiones, repetidas 3x con y sin los flags: ninguna suya. Banco: cal-55 y cal-46 a 0/3, y la
      # pregunta del snorkel de cal-69/70 desaparece. Revert = quitar estas líneas y poner los defaults en False.
      # (C5, RED_MENCIONES_SOLO_SIN_EXTRACTOR, se quitó en la limpieza ex9b: sin la pista del regex la red ya no corre.)
      LUGAR_DESCONOCIDO_AL_RAG: "true"
      HOTEL_DEL_CATALOGO_DA_ISLA: "true"
      # CAL-A PROMOCIONADO 17-oct (Gadea con Claude): la profundidad por certificación en el catálogo (banco: cal-18
      # 3/3 → 0/3) y el aviso que falta AÑADIDO AL FINAL (A6, revisor GPT-6 Luna). Ronda core cala6-B frente a calc-B:
      # 96,5 % = 96,5 %, 27/32 frente a 25/32 diálogos sin fallo; ninguna regresión suya (repetidas 3x con y sin).
      # Revert = quitar estas dos líneas y poner los defaults de src/config.py en False.
      CATALOGO_PROFUNDIDAD: "true"
      AVISOS_AL_FINAL: "true"
      # r6-2 PROMOCIONADO 17-oct (Gadea con Claude): la memoria (resumen y notas del asesor) no guarda como hecho lo que el
      # cliente ordena o dice que otro autorizó. Revert = quitar esta línea y poner el default de src/config.py en False.
      MEMORIA_SIN_ORDENES_DEL_CLIENTE: "true"
      # r6-2 PROMOCIONADO 17-oct (decisión de Gadea): pedir datos de OTROS clientes recibe una negativa de privacidad,
      # no el pase a un asesor. Revert = quitar esta línea y poner el default de src/config.py en False.
      DATOS_AJENOS_SE_NIEGAN: "true"
    depends_on:
      dp-pre-postgres:
        condition: service_healthy
      dp-pre-redis:
        condition: service_healthy
    networks:
      - dp-net

  # ==================== PRO (Production) ====================
  dp-pro-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRO_POSTGRES_PASSWORD:-pro_changeme}
      POSTGRES_DB: diving_planet
    volumes:
      - pgdata_pro:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pro-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-pro-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${PRO_REDIS_PASSWORD:-pro_changeme}
    volumes:
      - redis_data_pro:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PRO_REDIS_PASSWORD:-pro_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-pro-bot:
    logging: *registro-limitado
    build: .
    container_name: dp-pro-bot
    restart: unless-stopped
    env_file:
      - .env.pro
    environment:
      DATABASE_URL: postgresql://postgres:${PRO_POSTGRES_PASSWORD:-pro_changeme}@dp-pro-postgres:5432/diving_planet
      REDIS_URL: redis://:${PRO_REDIS_PASSWORD:-pro_changeme}@dp-pro-redis:6379/0
      APP_ENV: production
    depends_on:
      dp-pro-postgres:
        condition: service_healthy
      dp-pro-redis:
        condition: service_healthy
    networks:
      - dp-net

  # ==================== Chatwoot (shared inbox, own data store) ====================
  dp-chatwoot-postgres:
    logging: *registro-limitado
    image: pgvector/pgvector:pg16
    container_name: dp-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}
      POSTGRES_DB: chatwoot_production
    volumes:
      - pgdata_chatwoot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-chatwoot-redis:
    logging: *registro-limitado
    image: redis:7-alpine
    container_name: dp-chatwoot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}
    volumes:
      - redis_data_chatwoot:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-net

  dp-chatwoot:
    logging: *registro-limitado
    image: chatwoot/chatwoot:latest
    container_name: dp-chatwoot
    restart: unless-stopped
    depends_on:
      dp-chatwoot-postgres:
        condition: service_healthy
      dp-chatwoot-redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change_me_to_a_random_secret_key_base}
      FRONTEND_URL: https://chatwoot.is-core.dev
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "true"
      DATABASE_URL: postgresql://postgres:${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}@dp-chatwoot-postgres:5432/chatwoot_production
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/1
      REDIS_SIDEKIQ_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/2?read_timeout=10&connect_timeout=10
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      MAILER_SENDER_EMAIL: noreply@divingplanet.org
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - dp-net

  dp-chatwoot-worker:
    logging: *registro-limitado
    image: chatwoot/chatwoot:latest
    container_name: dp-chatwoot-worker
    restart: unless-stopped
    depends_on:
      dp-chatwoot-postgres:
        condition: service_healthy
      dp-chatwoot-redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change_me_to_a_random_secret_key_base}
      FRONTEND_URL: https://chatwoot.is-core.dev
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "true"
      DATABASE_URL: postgresql://postgres:${CHATWOOT_POSTGRES_PASSWORD:-chatwoot_changeme}@dp-chatwoot-postgres:5432/chatwoot_production
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/1
      REDIS_SIDEKIQ_URL: redis://:${CHATWOOT_REDIS_PASSWORD:-chatwoot_changeme}@dp-chatwoot-redis:6379/2?read_timeout=10&connect_timeout=10
      RAILS_ENV: production
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - dp-net

networks:
  dp-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata_pre:
  pgdata_pro:
  pgdata_chatwoot:
  redis_data_pre:
  redis_data_pro:
  redis_data_chatwoot:
