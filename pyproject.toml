[project]
name = "diving-planet-bot"
version = "0.1.0"
description = "AI-powered customer service chatbot for Diving Planet Cartagena"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Core LLM & Agents ---
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",

    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- Database ---
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # --- Vector Store / Embeddings ---
    "pgvector>=0.3.0",

    # --- Cache ---
    "redis>=5.0.0",

    # --- Observability ---
    "langsmith>=0.3.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501 (line too long) is off project-wide: the bot's message copy is full of
# long bilingual strings with URLs/phone numbers that don't benefit from wrapping.
# UP042: Step(str, Enum) predates StrEnum support and is used pervasively;
# not worth the behavior-change risk to swap it for a lint nitpick.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
