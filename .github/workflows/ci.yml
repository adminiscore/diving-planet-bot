name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diving_planet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diving_planet_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-not-real
      APP_ENV: test
      ENV_FILE: .env.ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Compile check
        run: python -m compileall src tests -q

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_fuzzy.py \
            tests/test_intent_detector.py \
            tests/test_intent_typo_tolerance.py \
            tests/test_decision_tree.py \
            tests/test_retrieval_rerank.py \
            tests/test_pricing_consistency.py \
            tests/test_rag_safety.py \
            tests/test_chatwoot_buttons.py \
            tests/test_state_store.py \
            tests/test_state_store_integration.py \
            tests/test_orchestrator.py \
            tests/test_nit_fixes.py \
            tests/test_padi_freetext.py \
            tests/FreeText/test_mixed_group.py \
            -v --tb=short
