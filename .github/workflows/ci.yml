name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diving_planet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diving_planet_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-not-real
      APP_ENV: test
      ENV_FILE: .env.ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Compile check
        run: python -m compileall src tests -q

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_fuzzy.py \
            tests/test_intent_detector.py \
            tests/test_intent_typo_tolerance.py \
            tests/test_retrieval_rerank.py \
            tests/test_pricing_consistency.py \
            tests/test_rag_safety.py \
            tests/test_chatwoot_buttons.py \
            tests/test_state_store.py \
            tests/test_state_store_integration.py \
            tests/test_nit_fixes.py \
            tests/test_padi_freetext.py \
            tests/test_orchestration_state.py \
            tests/test_orchestration_router.py \
            tests/test_agent_arch_graph.py \
            tests/test_deflection_agent.py \
            tests/test_escalation_agent.py \
            tests/test_changes_agent.py \
            tests/test_info_agent.py \
            tests/test_booking_agent.py \
            tests/test_booking_subgraph_nodes.py \
            tests/test_llm_call_reduction.py \
            -v --tb=short

  deploy-pre:
    name: Deploy to PRE
    needs: test
     # PRE is a single shared environment. Each person deploys via their own
    # "pre_*" mirror branch (pushed intentionally, not on every routine commit
    # to their integration branch); whichever pushes last "wins" (see
    # docs/deploy-pre-redeploy.md).
    if: (github.ref == 'refs/heads/feature/pre_gadea' || github.ref == 'refs/heads/feature/pre_alvaro' || github.ref == 'refs/heads/feature/pre_pruebaGon') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRE_VPS_SSH_KEY }}" > ~/.ssh/pre_vps
          chmod 600 ~/.ssh/pre_vps
          ssh-keyscan -H "${{ secrets.PRE_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Redeploy dp-pre-bot
        run: |
          ssh -i ~/.ssh/pre_vps root@${{ secrets.PRE_VPS_HOST }} '
            set -euo pipefail
            cd /opt/diving-planet-bot
            git remote set-branches origin "*"
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            # --- Diagnostico + auto-recuperacion de dp-pre-postgres (2026-07-31) ---
            # Solo actua si Postgres NO esta healthy (compose aborta el deploy por
            # depends_on: service_healthy). Imprime el motivo en el log de la Action
            # (disco/memoria/logs) e intenta recuperarlo (liberar imagenes colgantes
            # + restart, esperando healthy). Seguro: restart preserva el volumen.
            h=$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{end}}" dp-pre-postgres 2>/dev/null || echo missing)
            echo "postgres health = $h"
            if [ "$h" != "healthy" ]; then
              echo "=== dp-pre-postgres NO healthy -> diagnostico ==="
              df -h / || true
              free -h || true
              docker system df || true
              echo "--- postgres logs (tail 50) ---"
              docker logs dp-pre-postgres --tail 50 2>&1 || true
              echo "=== recuperacion: liberar disco (SEGURO — no toca contenedores en marcha, imagenes en uso ni volumenes/datos; PRO intacto) ==="
              docker builder prune -af || true
              docker image prune -af || true
              echo "--- disco tras limpieza ---"
              df -h / || true
              docker system df || true
              echo "=== restart dp-pre-postgres ==="
              docker restart dp-pre-postgres || true
              for i in $(seq 1 24); do
                h=$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{end}}" dp-pre-postgres 2>/dev/null || echo "")
                echo "  wait $i: health=$h"
                if [ "$h" = "healthy" ]; then break; fi
                sleep 5
              done
              echo "postgres health tras recuperacion = $h"
              if [ "$h" != "healthy" ]; then
                echo "!!! postgres sigue unhealthy tras liberar disco + restart. Ultimos logs:"
                docker logs dp-pre-postgres --tail 60 2>&1 || true
              fi
            fi
            # LangSmith (Fase 5.3 / periodo de medicion del rollout, plan §5): inyecta
            # la API key desde el secret de GitHub en .env.pre (PRE only) para que el
            # bot trace a LangSmith. config._activate_langsmith_tracing la lee y enciende
            # el tracing. Se borra cualquier linea previa y se re-escribe (idempotente).
            # Si el secret esta vacio, config no enciende el tracing (no-op).
            sed -i "/^LANGSMITH_API_KEY=/d" .env.pre 2>/dev/null || true
            echo "LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}" >> .env.pre
            docker compose -f docker-compose.vps.yml up -d --build dp-pre-bot
            sleep 5
            docker exec dp-pre-bot python -m scripts.load_embeddings --yes
            docker exec dp-pre-bot python -c "import urllib.request; print(urllib.request.urlopen(\"http://localhost:8000/health\").read())"
          '
