name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diving_planet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diving_planet_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-not-real
      APP_ENV: test
      ENV_FILE: .env.ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src

      - name: Compile check
        run: python -m compileall src tests -q

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_fuzzy.py \
            tests/test_intent_detector.py \
            tests/test_intent_typo_tolerance.py \
            tests/test_retrieval_rerank.py \
            tests/test_pricing_consistency.py \
            tests/test_rag_safety.py \
            tests/test_chatwoot_buttons.py \
            tests/test_state_store.py \
            tests/test_state_store_integration.py \
            tests/test_nit_fixes.py \
            tests/test_padi_freetext.py \
            tests/test_orchestration_state.py \
            tests/test_orchestration_router.py \
            tests/test_agent_arch_graph.py \
            tests/test_deflection_agent.py \
            tests/test_escalation_agent.py \
            tests/test_changes_agent.py \
            tests/test_info_agent.py \
            tests/test_booking_agent.py \
            tests/test_booking_subgraph_nodes.py \
            tests/test_llm_call_reduction.py \
            -v --tb=short

  deploy-pre:
    name: Deploy to PRE
    needs: test
    # PRE is a single shared environment. Each person deploys via their own
    # "pre_*" mirror branch (pushed intentionally, not on every routine commit
    # to their integration branch); whichever pushes last "wins" (see
    # docs/deploy-pre-redeploy.md).
    if: (github.ref == 'refs/heads/feature/pre_gadea' || github.ref == 'refs/heads/feature/pre_alvaro' || github.ref == 'refs/heads/feature/pre_pruebaGon') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # NOTA: la serializacion via `concurrency: deploy-pre` se retiro porque dejaba
    # deploys en cola detras de una corrida colgada (SSH/docker), impidiendo que
    # aterrizaran los fixes. El modelo "ultimo push gana" ya lo da el `git reset
    # --hard` + `docker compose up -d --build`. Reintroducir la serializacion solo
    # con cancel-in-progress: true si vuelve el choque de "container name in use".

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRE_VPS_SSH_KEY }}" > ~/.ssh/pre_vps
          chmod 600 ~/.ssh/pre_vps
          ssh-keyscan -H "${{ secrets.PRE_VPS_HOST }}" >> ~/.ssh/known_hosts

      # El script remoto se entrega por STDIN con un heredoc `bash -s <<'REMOTE'`
      # (NO como un argumento entre comillas simples). Motivo (2026-09-16): el
      # patron anterior `ssh host 'script largo...'` era fragil -- una comilla
      # simple en cualquier parte del script (p.ej. `grep '^LANGFUSE_'`) rompia el
      # entrecomillado y truncaba el script remoto, que moria tras `git checkout`
      # sin llegar al `docker compose up --build` -> PRE se quedaba con el bot
      # viejo (deploy "verde" en 9s pero sin reconstruir). Con el heredoc el script
      # viaja intacto por stdin, inmune a comillas/globbing. El fichero se guarda
      # en LF (sin CRLF) para no mandar `\r` al bash remoto.
      - name: Redeploy dp-pre-bot
        run: |
          ssh -i ~/.ssh/pre_vps root@${{ secrets.PRE_VPS_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/diving-planet-bot
          git remote set-branches origin "*"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          echo "=== codigo desplegado en el VPS ==="
          git log --oneline -1
          # Postgres: auto-recuperacion si NO esta healthy (compose aborta por depends_on)
          h=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' dp-pre-postgres 2>/dev/null || echo missing)
          echo "postgres health = $h"
          if [ "$h" != "healthy" ]; then
            echo "=== dp-pre-postgres NO healthy -> liberar disco + restart ==="
            df -h / || true
            docker logs dp-pre-postgres --tail 40 2>&1 || true
            docker builder prune -af || true
            docker image prune -af || true
            docker restart dp-pre-postgres || true
            for i in $(seq 1 24); do
              h=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' dp-pre-postgres 2>/dev/null || echo "")
              echo "  wait $i: health=$h"
              if [ "$h" = "healthy" ]; then break; fi
              sleep 5
            done
            echo "postgres health tras recuperacion = $h"
          fi
          # Langfuse keys -> .env.pre (idempotente; sin claves, config no enciende el tracing)
          sed -i "/^LANGFUSE_PUBLIC_KEY=/d;/^LANGFUSE_SECRET_KEY=/d;/^LANGFUSE_HOST=/d" .env.pre 2>/dev/null || true
          echo "LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" >> .env.pre
          echo "LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" >> .env.pre
          echo "LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}" >> .env.pre
          echo "=== rebuild + recreate dp-pre-bot ==="
          docker compose -f docker-compose.vps.yml up -d --build --force-recreate dp-pre-bot
          # Limpieza de disco post-build (cada --build deja capas huerfanas; si el
          # disco se llena, Chatwoot -mismo disco- responde 500 y el chat no abre)
          docker builder prune -af || true
          docker image prune -af || true
          echo "=== disco tras limpieza ==="
          df -h / || true
          # Chatwoot: restart SOLO si no responde (probe por su propio Ruby). Es
          # COMPARTIDO con PRO -> un restart corta el chat unos segundos para ambos,
          # asi que en un deploy con Chatwoot sano NO se toca.
          cw=$(docker exec dp-chatwoot ruby -e 'require "net/http"; begin; puts Net::HTTP.get_response(URI("http://localhost:3000/")).code; rescue; puts "000"; end' 2>/dev/null || echo "000")
          echo "chatwoot http = $cw"
          case "$cw" in
            2*|3*) echo "chatwoot sano ($cw) -> no se toca" ;;
            *)
              echo "=== dp-chatwoot NO sano ($cw) -> restart (web + worker) ==="
              docker restart dp-chatwoot dp-chatwoot-worker || true
              echo "--- esperando arranque de Rails (~20-40s) ---"
              for i in $(seq 1 18); do
                sleep 5
                cw=$(docker exec dp-chatwoot ruby -e 'require "net/http"; begin; puts Net::HTTP.get_response(URI("http://localhost:3000/")).code; rescue; puts "000"; end' 2>/dev/null || echo "000")
                echo "  wait $i: http=$cw"
                case "$cw" in 2*|3*) break ;; esac
              done
              echo "chatwoot http final = $cw"
              docker logs dp-chatwoot --tail 30 2>&1 || true
              ;;
          esac
          sleep 5
          docker exec dp-pre-bot python -m scripts.load_embeddings --yes
          docker exec dp-pre-bot python -c 'import urllib.request; print(urllib.request.urlopen("http://localhost:8000/health").read())'
          # Verificacion DEFINITIVA de que el rebuild aterrizo el fix del saludo:
          # _is_greeting_only("hola que tal?") == True SOLO en el codigo nuevo.
          echo "=== VERIFICACION FIX SALUDO EN dp-pre-bot ==="
          docker exec dp-pre-bot python -c 'from src.agents.conversational_core import _is_greeting_only; print("GREETING_FIX_LIVE=", _is_greeting_only("hola que tal?"))' 2>&1 || echo "GREETING_FIX_LIVE= ERROR"
          echo "=== LANGFUSE: estado en dp-pre-bot ==="
          docker exec dp-pre-bot sh -c "env | grep -iE '^LANGFUSE_' | sed 's/=.*/=SET/'" || echo "(sin LANGFUSE_* en el env)"
          # Diagnostico de trazas SIN SSH: lo que el bot logueo de Langfuse/OpenTelemetry y si,
          # con el mismo init que el bot, el tracing queda activo y las claves autentican.
          # No envia trazas (una traza de prueba por deploy ensuciaria las fotos de latencia).
          echo "=== LANGFUSE: logs del bot ==="
          docker logs dp-pre-bot 2>&1 | grep -iE "langfuse|opentelemetry|otel|exporter" | tail -20 || true
          echo "=== LANGFUSE: tracing y claves desde el contenedor ==="
          docker exec dp-pre-bot python -c 'from src.config import settings; from src import observability as o; print("LANGFUSE_ENABLED=", o.langfuse_enabled(settings), "APP_ENV=", settings.app_env); from langfuse import get_client; print("LANGFUSE_AUTH=", get_client().auth_check())' 2>&1 | tail -6 || echo "LANGFUSE_AUTH= ERROR"
          REMOTE
