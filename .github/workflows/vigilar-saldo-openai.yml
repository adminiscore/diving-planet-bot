name: Vigilar saldo de OpenAI (PRE)

# r6-1(c) (17-oct, decisión de Álvaro: avisar por correo de GitHub Y en Coral). Cada hora comprueba con una llamada
# mínima (1 token) que la cuenta de OpenAI de PRE puede contestar, DENTRO del contenedor del bot y con su clave
# (`scripts/vigilar_saldo_openai.py`). Si no puede (sin saldo, clave inválida, caído), el job falla -> GitHub manda
# un correo; y si el chat del equipo tiene la identidad `vigilante` (CORAL_TOKENS en /opt/coral-hub/.env), escribe un
# aviso en Coral. No toca el bot ni los datos. Ojo: GitHub solo ejecuta los `schedule` del fichero que está en la
# rama por defecto (main); hasta que llegue ahí, se puede lanzar a mano (workflow_dispatch).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  saldo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRE_VPS_SSH_KEY }}" > ~/.ssh/pre_vps
          chmod 600 ~/.ssh/pre_vps
          ssh-keyscan -H "${{ secrets.PRE_VPS_HOST }}" >> ~/.ssh/known_hosts

      # Mismo patrón que el deploy: el script remoto va por STDIN (heredoc), inmune a comillas. Sin `set -x`: no se
      # imprime el token de Coral.
      - name: Comprobar que OpenAI contesta con la clave de PRE
        run: |
          ssh -i ~/.ssh/pre_vps root@${{ secrets.PRE_VPS_HOST }} bash -s <<'REMOTE'
          set -uo pipefail
          TOKEN=""
          if [ -f /opt/coral-hub/.env ]; then
            TOKEN=$(grep '^CORAL_TOKENS=' /opt/coral-hub/.env | sed 's/^CORAL_TOKENS=//' | tr ',' '\n' \
                    | grep '^vigilante:' | cut -d: -f2- || true)
          fi
          docker exec -e CORAL_URL=https://pre.is-core.dev/coral -e CORAL_TOKEN_VIGILANTE="$TOKEN" \
            dp-pre-bot python -m scripts.vigilar_saldo_openai --coral
          REMOTE
