# =============================================================================
# Diving Planet Bot - Local Development Stack (DEV)
# =============================================================================
# Usage:
#   docker compose up -d                        # PostgreSQL + Redis only
#   docker compose --profile chatwoot up -d     # + Chatwoot (optional)
#   docker compose down
# =============================================================================

services:
  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dp-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diving_planet
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: dp-dev-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --timeout 0 --tcp-keepalive 60
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Chatwoot (optional, start with --profile chatwoot) ---
  chatwoot-rails:
    image: chatwoot/chatwoot:v3.11.0
    container_name: dp-dev-chatwoot
    restart: unless-stopped
    profiles:
      - chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production
      FRONTEND_URL: http://localhost:3300
      DEFAULT_LOCALE: es
      ENABLE_RACK_ATTACK_WIDGET_API: "false"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatwoot_dev
      REDIS_URL: redis://redis:6379/1
      REDIS_SIDEKIQ_URL: redis://redis:6379/2?read_timeout=10&connect_timeout=10
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      MAILER_SENDER_EMAIL: noreply@divingplanet.org
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "3300:3000"

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.11.0
    container_name: dp-dev-chatwoot-worker
    restart: unless-stopped
    profiles:
      - chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production
      FRONTEND_URL: http://localhost:3300
      DEFAULT_LOCALE: es
      ENABLE_RACK_ATTACK_WIDGET_API: "false"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatwoot_dev
      REDIS_URL: redis://redis:6379/1
      REDIS_SIDEKIQ_URL: redis://redis:6379/2?read_timeout=10&connect_timeout=10
      SIDEKIQ_CONCURRENCY: 5
      RAILS_ENV: production
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  pgdata_dev:
  redis_data_dev:


