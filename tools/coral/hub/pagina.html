<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral</title>
<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --texto: #1d2330; --suave: #667085; --borde: #e3e6eb;
    --acento: #0e7c86; --acento-suave: #e3f3f4; --aviso: #8a5a00; --aviso-suave: #fff4dc;
    --peligro: #b42318; --peligro-suave: #fde8e7; --ok: #127a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12151b; --panel: #1a1f27; --texto: #e6e9ee; --suave: #98a2b3; --borde: #2a313c;
      --acento: #4fc3cc; --acento-suave: #173a3e; --aviso: #f5c96a; --aviso-suave: #3a2f17;
      --peligro: #f97066; --peligro-suave: #3d1d1b; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--borde); background: var(--panel);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--suave); font-size: 13px; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px;
             margin-bottom: 10px; }
  .tarjeta h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--borde); display: inline-block; }
  .punto.on { background: var(--ok); }
  .dato { color: var(--suave); font-size: 13px; overflow-wrap: anywhere; }
  .pre { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-top: 4px;
         background: var(--acento-suave); color: var(--acento); }
  .pre.ocupado { background: var(--peligro-suave); color: var(--peligro); }
  .solape { background: var(--aviso-suave); color: var(--aviso); border-radius: 8px; padding: 8px 10px;
            font-size: 13px; margin-bottom: 10px; }
  #chat { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; display: flex;
          flex-direction: column; height: calc(100vh - 110px); min-height: 420px; }
  #lista { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { padding: 6px 0; border-bottom: 1px dashed var(--borde); }
  .msg:last-child { border-bottom: 0; }
  .cab { font-size: 12px; color: var(--suave); }
  .cab b { color: var(--texto); }
  .tipo { font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 4px; background: var(--acento-suave);
          color: var(--acento); }
  .tipo.pregunta { background: var(--aviso-suave); color: var(--aviso); }
  .tipo.propuesta { background: var(--peligro-suave); color: var(--peligro); }
  .tipo.resultado { background: var(--acento); color: var(--panel); }
  .msg.sistema .texto { color: var(--suave); font-style: italic; }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
  select, input, textarea, button { font: inherit; color: var(--texto); background: var(--fondo);
          border: 1px solid var(--borde); border-radius: 8px; padding: 6px 8px; }
  textarea { flex: 1 1 260px; resize: vertical; min-height: 38px; }
  button { background: var(--acento); color: var(--panel); border: 0; cursor: pointer; padding: 6px 14px; }
  #entrar { max-width: 420px; margin: 12vh auto; }
  #entrar input { width: 100%; margin: 8px 0; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<header><h1>Coral</h1><span id="quien"></span></header>

<div id="entrar" class="tarjeta oculto">
  <h3>Entrar</h3>
  <div class="dato">Pega tu token (está en <code>.env.coral</code>, línea <code>CORAL_TOKEN</code>).</div>
  <input id="token" type="password" autocomplete="off">
  <button id="guardar">Entrar</button>
</div>

<main id="app" class="oculto">
  <section>
    <div id="solapes"></div>
    <div id="equipo"></div>
  </section>
  <section id="chat">
    <div id="lista"></div>
    <form id="enviar">
      <select id="para"><option value="todos">a todos</option></select>
      <select id="tipo"><option value="aviso">aviso</option><option value="pregunta">pregunta</option>
        <option value="propuesta">propuesta</option><option value="resultado">resultado</option></select>
      <textarea id="texto" placeholder="Escribe… (Enter envía, Mayús+Enter salto de línea)"></textarea>
      <button>Enviar</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("coral_token") || ""; } catch (e) {}
let ultimo = 0, yo = "";

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "Authorization": "Bearer " + token,
                                                        "Content-Type": "application/json" } });
  if (r.status === 401) { salir(); throw new Error("token"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

function salir() {
  try { localStorage.removeItem("coral_token"); } catch (e) {}
  $("app").classList.add("oculto"); $("entrar").classList.remove("oculto");
}

function hora(iso) {
  const d = new Date(iso);
  const hoy = new Date().toDateString() === d.toDateString();
  return (hoy ? "" : d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }) + " ")
       + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
}

function hace(iso) {
  if (!iso) return "sin señales";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 2) return "ahora";
  if (min < 60) return "hace " + min + " min";
  return "visto " + hora(iso);
}

function el(etiqueta, clase, texto) {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function pintarMensaje(m) {
  const d = el("div", "msg" + (m.origen === "sistema" ? " sistema" : ""));
  const cab = el("div", "cab");
  const autor = m.de + (m.origen === "claude" ? " (Claude)" : "");
  cab.append(el("b", "", autor), document.createTextNode(" → " + m.para + " · " + hora(m.ts) + " · #" + m.id));
  if (m.tipo !== "aviso") cab.append(el("span", "tipo " + m.tipo, m.tipo));
  if (m.responde_a) cab.append(document.createTextNode(" (a #" + m.responde_a + ")"));
  d.append(cab, el("div", "texto", m.texto));
  return d;
}

async function escuchar() {
  const lista = $("lista");
  for (;;) {
    try {
      const nuevos = await api("api/mensajes?" + (ultimo ? "desde=" + ultimo + "&esperar=25" : "limite=200"));
      const abajo = lista.scrollHeight - lista.scrollTop - lista.clientHeight < 60;
      for (const m of nuevos) { lista.append(pintarMensaje(m)); ultimo = Math.max(ultimo, m.id); }
      if (nuevos.length && abajo) lista.scrollTop = lista.scrollHeight;
    } catch (e) {
      if (e.message === "token") return;
      await new Promise((r) => setTimeout(r, 5000));
    }
  }
}

async function pintarEquipo() {
  const datos = await api("api/equipo");
  const cont = $("equipo"); cont.replaceChildren();
  for (const e of datos.equipo) {
    const t = el("div", "tarjeta");
    const h = el("h3");
    const activo = e.visto && (Date.now() - new Date(e.visto)) < 20 * 60000;
    h.append(el("span", "punto" + (activo ? " on" : "")), document.createTextNode(e.persona));
    t.append(h, el("div", "dato", hace(e.visto)));
    if (e.tarea) t.append(el("div", "dato", "Tarea: " + e.tarea));
    if (e.rama) t.append(el("div", "dato", "Rama: " + e.rama));
    if (e.ficheros.length) t.append(el("div", "dato", e.ficheros.length + " ficheros con cambios"));
    const ocupado = e.pre !== "libre";
    t.append(el("span", "pre" + (ocupado ? " ocupado" : ""),
                "PRE: " + e.pre + (ocupado ? " hasta " + hora(e.pre_hasta) : "")));
    cont.append(t);
  }
  const sol = $("solapes"); sol.replaceChildren();
  for (const s of datos.solapes) {
    sol.append(el("div", "solape", "Tú y " + s.persona + " tocáis: " + s.ficheros.join(", ")));
  }
}

async function arrancar() {
  try {
    const r = await api("api/yo");
    yo = r.persona;
    $("quien").textContent = "como " + yo;
    const para = $("para");
    for (const p of r.personas) if (p !== yo) para.append(new Option("a " + p, p));
  } catch (e) { return; }
  $("entrar").classList.add("oculto"); $("app").classList.remove("oculto");
  pintarEquipo().catch(() => {});
  setInterval(() => pintarEquipo().catch(() => {}), 20000);
  escuchar();
}

$("guardar").onclick = () => {
  token = $("token").value.trim();
  try { localStorage.setItem("coral_token", token); } catch (e) {}
  arrancar();
};

$("texto").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("enviar").requestSubmit(); }
});

$("enviar").onsubmit = async (ev) => {
  ev.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  try {
    await api("api/mensajes", { method: "POST", body: JSON.stringify({
      texto, para: $("para").value, tipo: $("tipo").value, origen: "persona" }) });
    $("texto").value = "";
  } catch (e) { alert("No se pudo enviar: " + e.message); }
};

if (token) arrancar(); else salir();
</script>
</body>
</html>
